# A NEW UPDATE MUST BE THIS MANY DAYS OLD
MinimumAge=7
# PREVIOUSLY DOWNLOADED PACKAGES DELETED IF OLDER THAN THIS MANY DAYS
OldUpdates=60
# NETWORK TIMEOUT IN SECONDS (900s = 15m)
NetTimeout=900
# SCRIPT WILL SELF-UPDATE IF SET TO 1
SelfUpdate=1
# SKIP AGE CHECK AND INSTALL IMMEDIATELY (SET VIA -b FLAG)
# SkipAgeCheck=0
# ROLLBACK TO PREVIOUS VERSION (USE: bash syno.plexupdate.sh -r)
# Rollback=false
